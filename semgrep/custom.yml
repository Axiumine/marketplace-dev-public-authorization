# Project-specific Semgrep rules for marketplace-dev-public-authorization.
#
# Registry packs (p/typescript, p/javascript, p/nodejs, p/secrets) are passed
# on the command line by the `semgrep` / `semgrep:ci` yarn scripts. This file
# holds only rules specific to the Marketplace platform's own conventions.
#
# Note: the sink below is restricted to console / logger / log receivers on
# purpose — matching any `x.y(...)` call gives false positives. Without that
# restriction, `redisClient.hSet(keyRefresh, refreshTokenData)` in
# src/lib/db/redis/setRedisLoginSession.mts would match: the argument is named
# after the token, but the call writes the session to Redis, it does not log
# anything.
rules:
  # Opaque access/refresh tokens live in Redis sessions and signed cookies.
  # Logging them defeats the whole point of opaque tokens.
  - id: marketplace-no-log-auth-token
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Possible logging of an access/refresh token. Auth tokens must not be written to logs (see CLAUDE.md — opaque tokens + Redis sessions).
    metadata:
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $ARG, ...)
          - patterns:
              - pattern: $L.$M(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: (?i)^(logger|log)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)(accesstoken|access_token|refreshtoken|refresh_token|bearer)

  # No marketplace-no-log-reset-secret rule here: that rule guards the
  # reset-password flow (resetHash / resetDateReq), and this service has no
  # such flow — `grep -rniE 'resetpwd|resethash|resetdatereq' src` returns
  # nothing. Reset-password lives in marketplace-dev-public-resource
  # (src/lib/access/resetPwdFlow.mts). Do not copy the rule here speculatively;
  # add it back only if this service grows that flow.
